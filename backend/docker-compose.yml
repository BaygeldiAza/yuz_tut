services:

  api:
    build:
      context: .
      network: host

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_started

    volumes:
      - .:/code

    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  postgres:
    image: postgres:17

    environment:
      POSTGRES_DB: yuz_tut
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d yuz_tut"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7

    ports:
      - "6380:6379"

  test-db:
    image: postgres:17
    container_name: yuz_tut_test_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: yuz_tut_test
    ports:
      - "5433:5432"
    volumes:
      - test_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d yuz_tut_test"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  test_postgres_data: